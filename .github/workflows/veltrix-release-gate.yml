name: Veltrix release gate

on:
  push:
    branches:
      - codex/veltrix-release-operations
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e "./backend[dev]"

      - name: Create disposable PostgreSQL databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -p 55432 -U postgres veltrix_portal_test
          createdb -h 127.0.0.1 -p 55432 -U postgres veltrix_accept_source
          createdb -h 127.0.0.1 -p 55432 -U postgres veltrix_accept_restore
          psql -h 127.0.0.1 -p 55432 -U postgres -d veltrix_accept_source -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE acceptance_items (
            id integer PRIMARY KEY,
            label text NOT NULL,
            amount integer NOT NULL
          );
          INSERT INTO acceptance_items VALUES
            (1, 'alpha', 10),
            (2, 'beta', 20),
            (3, 'gamma', 30);
          SQL

      - name: Run complete backend suite on Linux
        working-directory: backend
        env:
          PGPASSWORD: postgres
          PYTHONDONTWRITEBYTECODE: "1"
          VPN_PORTAL_TEST_PG_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:55432/veltrix_portal_test
        run: >-
          sudo --preserve-env=PGPASSWORD,PYTHONDONTWRITEBYTECODE,VPN_PORTAL_TEST_PG_URL
          "$(command -v python)" -m pytest -q -p no:cacheprovider

      - name: Lint the release operations slice
        working-directory: backend
        run: >-
          python -m ruff check
          app/operations/backup.py
          app/operations/watchdog.py
          app/services/vpn_node_deployment.py
          app/services/vpn_node_transport.py
          tests/test_vpn_operations_backup.py
          tests/test_vpn_operations_units.py
          tests/test_vpn_operations_watchdog.py
          tests/test_vpn_node_transport.py
          tests/test_vpn_node_deployment.py
          tests/test_vpn_control_dispatcher.py

      - name: Verify hardened systemd units
        run: |
          sudo install -d -m 0755 \
            /opt/domain-drop-catcher/backend/.venv/bin \
            /opt/domain-drop-catcher/frontend/dist \
            /etc/veltrix \
            /var/backups/domain-drop-catcher
          sudo ln -s "$(command -v python)" \
            /opt/domain-drop-catcher/backend/.venv/bin/python
          sudo install -m 0600 /dev/null /opt/domain-drop-catcher/backend/.env
          sudo install -m 0600 /dev/null /etc/veltrix-operations.env
          sudo install -m 0600 /dev/null /etc/veltrix/known_hosts
          sudo install -m 0644 deploy/domain-drop-control.service \
            /etc/systemd/system/domain-drop-control.service
          systemd-analyze verify --recursive-errors=yes \
            deploy/veltrix-backup.service \
            deploy/veltrix-backup.timer \
            deploy/veltrix-watchdog.service \
            deploy/veltrix-watchdog.timer

      - name: Verify shared trust DAC without capabilities
        run: |
          sudo install -d -o root -g root -m 0755 /etc/veltrix-ci
          ssh-keygen -q -t ed25519 -N '' -f /tmp/veltrix-ci-host-key
          awk '{print "node.example " $1 " " $2}' \
            /tmp/veltrix-ci-host-key.pub >/tmp/veltrix-ci-known-hosts
          RUNNER_GID="$(id -g)"
          sudo install -o root -g "$RUNNER_GID" -m 0640 \
            /tmp/veltrix-ci-known-hosts /etc/veltrix-ci/known_hosts
          python - "$RUNNER_GID" <<'PY'
          import sys
          from pathlib import Path
          from app.services.vpn_node_transport import validate_known_hosts_file

          validate_known_hosts_file(
              Path("/etc/veltrix-ci/known_hosts"),
              expected_reader_gid=int(sys.argv[1]),
          )
          PY
          sudo setpriv \
            --reuid 0 --regid 0 --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            "$(command -v python)" - <<'PY'
          from pathlib import Path

          status = Path("/proc/self/status").read_text(encoding="ascii")
          effective = next(
              line.split(":", 1)[1].strip()
              for line in status.splitlines()
              if line.startswith("CapEff:")
          )
          assert int(effective, 16) == 0
          assert Path("/etc/veltrix-ci/known_hosts").read_bytes()
          PY

      - name: Rehearse validated PostgreSQL backup and restore
        working-directory: backend
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:55432/veltrix_accept_source
          PGPASSWORD: postgres
          PYTHONDONTWRITEBYTECODE: "1"
          VPN_BACKUP_DIRECTORY: /tmp/veltrix-acceptance-backups
          VPN_BACKUP_ENABLED: "true"
          VPN_BACKUP_ENV_FILE: /tmp/veltrix-acceptance-source/app.env
          VPN_BACKUP_FRONTEND_DIST: /tmp/veltrix-acceptance-source/frontend
          VPN_BACKUP_NGINX_DIRECTORY: /tmp/veltrix-acceptance-source/nginx
          VPN_BACKUP_RETENTION: "2"
          VPN_BACKUP_SYSTEMD_UNIT: /tmp/veltrix-acceptance-source/control.service
        run: |
          sudo install -d -o root -g root -m 0700 \
            /tmp/veltrix-acceptance-source \
            /tmp/veltrix-acceptance-source/frontend \
            /tmp/veltrix-acceptance-source/nginx \
            /tmp/veltrix-acceptance-backups
          printf '%s\n' 'SYNTHETIC_ONLY=true' | \
            sudo tee /tmp/veltrix-acceptance-source/app.env >/dev/null
          printf '%s\n' '[Service]' 'Type=oneshot' 'ExecStart=/bin/true' | \
            sudo tee /tmp/veltrix-acceptance-source/control.service >/dev/null
          printf '%s\n' 'server { listen 127.0.0.1:18080; }' | \
            sudo tee /tmp/veltrix-acceptance-source/nginx/synthetic.conf >/dev/null
          printf '%s\n' '<!doctype html><title>synthetic</title>' | \
            sudo tee /tmp/veltrix-acceptance-source/frontend/index.html >/dev/null
          sudo chmod 0600 \
            /tmp/veltrix-acceptance-source/app.env \
            /tmp/veltrix-acceptance-source/control.service \
            /tmp/veltrix-acceptance-source/nginx/synthetic.conf \
            /tmp/veltrix-acceptance-source/frontend/index.html
          sudo --preserve-env=DB_URL,PGPASSWORD,PYTHONDONTWRITEBYTECODE,VPN_BACKUP_DIRECTORY,VPN_BACKUP_ENABLED,VPN_BACKUP_ENV_FILE,VPN_BACKUP_FRONTEND_DIST,VPN_BACKUP_NGINX_DIRECTORY,VPN_BACKUP_RETENTION,VPN_BACKUP_SYSTEMD_UNIT \
            "$(command -v python)" -m app.operations.backup
          SET_NAME="$(sudo "$(command -v python)" -c \
            'import json; print(json.load(open("/tmp/veltrix-acceptance-backups/latest-success.json"))["set_name"])')"
          DUMP="/tmp/veltrix-acceptance-backups/$SET_NAME/database.dump"
          sudo cmp -s \
            /tmp/veltrix-acceptance-backups/latest-success.json \
            "/tmp/veltrix-acceptance-backups/$SET_NAME/backup.json"
          sudo --preserve-env=PGPASSWORD pg_restore --exit-on-error \
            --host=127.0.0.1 --port=55432 --username=postgres \
            --dbname=veltrix_accept_restore "$DUMP"
          RESULT="$(PGPASSWORD=postgres psql \
            -h 127.0.0.1 -p 55432 -U postgres -d veltrix_accept_restore -Atqc \
            "SELECT count(*) || ':' || sum(amount) || ':' || string_agg(label, ',' ORDER BY id) FROM acceptance_items")"
          test "$RESULT" = '3:60:alpha,beta,gamma'
