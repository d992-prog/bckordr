# No URI suffix on proxy_pass: nginx forwards the original secret-bearing path
# to the application while veltrix_safe logs only the redacted mapped URI.
location ^~ /api/vpn-telegram/webhook/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
