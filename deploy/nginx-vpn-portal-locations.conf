# Include inside the main TLS portal `server {}` block.
# Also copy the next three directives into the separate port-80 redirect and
# worker-direct-8080 reject server blocks. Do not copy proxy locations there.
access_log /var/log/nginx/veltrix-access.log veltrix_safe;
error_log /dev/null;
add_header Cache-Control $veltrix_portal_cache_control always;

# The server-scoped error sink is intentional: nginx error entries can contain
# raw request lines for pre-location 400s and location 413/429/502 responses.
# Global nginx infrastructure errors outside these portal-facing vhosts retain
# their normal error log; status observability remains in veltrix_safe access logs.

location ^~ /api/vpn-portal/auth/ {
    limit_req zone=veltrix_auth burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /api/vpn-portal {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /api/vpn-portal/ {
