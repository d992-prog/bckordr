# Include once inside nginx's `http {}` context, before portal server blocks.
limit_req_zone $binary_remote_addr zone=veltrix_auth:10m rate=10r/m;

map $uri $veltrix_safe_uri {
    ~^/api/vpn-telegram/webhook/  /api/vpn-telegram/webhook/redacted;
    default                         $uri;
}

# Applies even when nginx rejects oversized headers before location selection.
map $uri $veltrix_portal_cache_control {
    ~^/api/vpn-portal(?:/|$)  "no-store";
    default                    "";
}

# Deliberately logs no raw request line, query string, referrer, header, or body.
log_format veltrix_safe '$remote_addr $request_method $veltrix_safe_uri $status $body_bytes_sent';
