# Include once inside nginx's `http {}` context, before portal server blocks.
# Cloudflare ranges verified against the official lists on 2026-09-30.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=veltrix_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=veltrix_portal_api:10m rate=5r/s;

map $uri $veltrix_safe_uri {
    ~^/api/vpn-telegram/webhook/  /api/vpn-telegram/webhook/redacted;
    default                         $uri;
}

# Applies even when nginx rejects oversized headers before location selection.
map $uri $veltrix_portal_cache_control {
    ~^/api/vpn-portal(?:/|$)  "no-store";
    ~^/cabinet(?:/|$)         "no-store";
    ~^/vpn(?:/|$)             "no-cache, max-age=0, must-revalidate";
    default                    "";
}

map $uri $veltrix_portal_referrer_policy {
    ~^/api/vpn-portal(?:/|$)  "no-referrer";
    ~^/cabinet(?:/|$)         "no-referrer";
    ~^/vpn(?:/|$)             "no-referrer";
    default                    "";
}

map $uri $veltrix_portal_content_type_options {
    ~^/api/vpn-portal(?:/|$)  "nosniff";
    ~^/cabinet(?:/|$)         "nosniff";
    ~^/vpn(?:/|$)             "nosniff";
    default                    "";
}

map $uri $veltrix_portal_frame_options {
    ~^/vpn(?:/|$)  "DENY";
    default         "";
}

map $uri $veltrix_portal_content_security_policy {
    ~^/vpn(?:/|$)  "frame-ancestors 'none'";
    default         "";
}

# Deliberately logs no raw request line, query string, referrer, header, or body.
log_format veltrix_safe '$remote_addr $request_method $veltrix_safe_uri $status $body_bytes_sent';
